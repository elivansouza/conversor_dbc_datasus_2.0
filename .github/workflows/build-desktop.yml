name: build-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            spec: packaging/windows.spec
            artifact: ConversorDBC-windows
            dist_path: dist/ConversorDBC
          - os: macos-latest
            spec: packaging/macos.spec
            artifact: ConversorDBC-macos-arm64
            dist_path: dist/ConversorDBC.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build com PyInstaller
        run: pyinstaller ${{ matrix.spec }} --noconfirm --clean

      - name: Publicar artefato (pasta onedir)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dist_path }}

      # A pasta onedir (exe + _internal/) so funciona distribuida por inteiro.
      # O instalador abaixo empacota tudo em um unico .exe, evitando o erro
      # "Failed to load Python DLL" que ocorre quando alguem compartilha so
      # o ConversorDBC.exe sem a pasta _internal.
      - name: Build instalador (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc packaging\inno_setup.iss

      - name: Publicar instalador (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ConversorDBC-Setup-windows
          path: dist/installer/ConversorDBC-Setup.exe
